# Learn more about configuring your app at:
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0e0c721ee62e0aead10de97a9edaeb36"
name = "First-Besarta-App"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "write_products,write_metaobject_definitions,write_metaobjects,write_customers,read_customers,read_orders"

[shop.metafields.loyalty.points_per_dollar_public]
type = "number_decimal"
name = "Loyalty points per dollar (public)"
description = "Derived public value for theme display. Source of truth is app metafield loyalty/settings."

[shop.metafields.loyalty.points_per_dollar_public.access]
admin = "merchant_read_write"
storefront = "public_read"

[customer.metafields.loyalty.points]
type = "number_integer"
name = "Loyalty Points"
description = "Stores customer loyalty points balance"

  [customer.metafields.loyalty.points.access]
  admin = "merchant_read_write"

[webhooks]
api_version = "2026-07"

  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"


 [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
   topics = ["orders/create"]


[auth]
redirect_urls = [
  "https://example.com/api/auth"
]


[build]
automatically_update_urls_on_dev = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[app_proxy]
url = "https://example.com/proxy/loyalty"
subpath = "loyalty"
prefix = "apps"
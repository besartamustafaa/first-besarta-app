# Learn more about configuring your app at:
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0e0c721ee62e0aead10de97a9edaeb36"
name = "First-Besarta-App"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "write_products,write_metaobject_definitions,write_metaobjects"

[shop.metafields.loyalty.points_per_dollar_public]
type = "number_decimal"
name = "Loyalty points per dollar (public)"
description = "Derived public value for theme display. Source of truth is app metafield loyalty/settings."

[shop.metafields.loyalty.points_per_dollar_public.access]
admin = "merchant_read_write"
storefront = "public_read"


[webhooks]
api_version = "2026-07"

  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"


[auth]
redirect_urls = [
  "https://example.com/api/auth"
]


[build]
automatically_update_urls_on_dev = true